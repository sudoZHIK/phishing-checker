[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-checker"
version = "0.1.0"
description = "Defensive local URL triage tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31,<3",
    "idna>=3.6,<4",
    "dnspython>=2.6,<3",
]

[project.scripts]
phishing-checker = "phishing_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]
